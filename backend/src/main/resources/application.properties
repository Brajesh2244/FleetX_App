# ===== FleetX Backend Configuration =====
spring.application.name=fleetx-backend
server.port=8080
server.servlet.context-path=/

# ===== MySQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/fleetx_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===== Jackson =====
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ===== JWT (demo secret - replace for real deployments) =====
fleetx.jwt.secret=fleetx-demo-secret-key-change-me-in-production-0123456789abcdef
fleetx.jwt.expiration-ms=86400000

# ===== Demo data seeding =====
fleetx.seed.enabled=true

# ===== Logging =====
logging.level.root=INFO
logging.level.com.fleetx=INFO
